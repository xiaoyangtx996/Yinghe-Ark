<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Yinghe Ark production pipeline</title>
  <desc id="desc">Five stages: text analysis, characters and scenes, storyboard, voiceover, export.</desc>
  <rect width="1200" height="280" rx="24" fill="#f7f1ea"/>
  <rect x="20" y="20" width="1160" height="240" rx="18" fill="#fcf8f3" stroke="#d9cfc3"/>
  <text x="48" y="64" fill="#8f5a28" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18" letter-spacing="2">HOW IT WORKS</text>
  <text x="48" y="100" fill="#1a1510" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="28" font-weight="600">一条完整制作管线</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <g transform="translate(48 132)">
      <rect width="190" height="96" rx="12" fill="#ebe3d8"/>
      <text x="16" y="36" fill="#8f5a28" font-size="16" font-weight="600">01 文本解析</text>
      <text x="16" y="64" fill="#5c5046" font-size="16">角色 · 场次 · 对白</text>
    </g>
    <text x="250" y="188" fill="#a56b32" font-size="22">→</text>
    <g transform="translate(278 132)">
      <rect width="190" height="96" rx="12" fill="#ebe3d8"/>
      <text x="16" y="36" fill="#8f5a28" font-size="16" font-weight="600">02 角色场景</text>
      <text x="16" y="64" fill="#5c5046" font-size="16">一致性资产</text>
    </g>
    <text x="480" y="188" fill="#a56b32" font-size="22">→</text>
    <g transform="translate(508 132)">
      <rect width="190" height="96" rx="12" fill="#ebe3d8"/>
      <text x="16" y="36" fill="#8f5a28" font-size="16" font-weight="600">03 分镜排镜</text>
      <text x="16" y="64" fill="#5c5046" font-size="16">提示词可重跑</text>
    </g>
    <text x="710" y="188" fill="#a56b32" font-size="22">→</text>
    <g transform="translate(738 132)">
      <rect width="190" height="96" rx="12" fill="#ebe3d8"/>
      <text x="16" y="36" fill="#8f5a28" font-size="16" font-weight="600">04 配音</text>
      <text x="16" y="64" fill="#5c5046" font-size="16">多角色合成</text>
    </g>
    <text x="940" y="188" fill="#a56b32" font-size="22">→</text>
    <g transform="translate(968 132)">
      <rect width="164" height="96" rx="12" fill="#ebe3d8"/>
      <text x="16" y="36" fill="#8f5a28" font-size="16" font-weight="600">05 成片</text>
      <text x="16" y="64" fill="#5c5046" font-size="16">导出发布</text>
    </g>
  </g>
</svg>
