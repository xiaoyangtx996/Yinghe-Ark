<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Yinghe Ark AI Film Studio</title>
  <desc id="desc">Open-source AI studio from script to finished short drama video.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14110e"/>
      <stop offset="55%" stop-color="#1c1712"/>
      <stop offset="100%" stop-color="#2a2118"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="372" rx="20" fill="none" stroke="rgba(212,160,106,0.22)" stroke-width="1"/>
  <g id="title-block" transform="translate(64 72)">
    <text x="0" y="0" fill="#d4a06a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18" letter-spacing="3">OPEN SOURCE FILM SUITE</text>
    <rect id="logo-slot" x="0" y="28" width="320" height="150" fill="none" stroke="rgba(212,160,106,0.15)" stroke-dasharray="6 6"/>
    <text x="0" y="220" fill="#f7f1ea" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="36" font-weight="600">Script to finished film</text>
    <text x="0" y="268" fill="#c4b6a6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20">Parse · Assets · Storyboard · Voice · Export</text>
    <text x="0" y="308" fill="#8a7b6c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Next.js 15 · MySQL · Redis · BullMQ</text>
  </g>
  <g id="project-proof" transform="translate(560 78)">
    <rect width="560" height="264" rx="18" fill="rgba(247,241,234,0.04)" stroke="rgba(212,160,106,0.18)"/>
    <text x="28" y="42" fill="#d4a06a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="16" letter-spacing="2">PIPELINE</text>
    <g id="pipe-slots" transform="translate(28 72)">
      <rect width="88" height="88" rx="14" fill="rgba(247,241,234,0.06)"/>
      <rect x="108" width="88" height="88" rx="14" fill="rgba(247,241,234,0.06)"/>
      <rect x="216" width="88" height="88" rx="14" fill="rgba(247,241,234,0.06)"/>
      <rect x="324" width="88" height="88" rx="14" fill="rgba(247,241,234,0.06)"/>
      <rect x="432" width="88" height="88" rx="14" fill="rgba(247,241,234,0.06)"/>
    </g>
    <text x="28" y="210" fill="#f7f1ea" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18">Text to script to board to film</text>
    <text x="28" y="242" fill="#8a7b6c" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="16">Replay any stage</text>
  </g>
</svg>
